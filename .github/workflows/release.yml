name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run tests
        run: go test ./...

      - name: Build release archives
        run: |
          mkdir -p dist
          targets=(
            "darwin/arm64"
            "darwin/amd64"
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
          )
          for target in "${targets[@]}"; do
            IFS="/" read -r goos goarch <<< "$target"
            ext=""
            if [ "$goos" = "windows" ]; then
              ext=".exe"
            fi
            out="dist/agybar${ext}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/agybar
            if [ "$goos" = "windows" ]; then
              (cd dist && zip -q "agybar_${goos}_${goarch}.zip" "agybar${ext}")
            else
              tar -C dist -czf "dist/agybar_${goos}_${goarch}.tar.gz" "agybar${ext}"
            fi
            rm -f "$out"
          done
          (cd dist && sha256sum agybar_* > checksums.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
