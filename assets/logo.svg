<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 116" width="420" height="116" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="420" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1E2E"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="420" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBA6F7" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#89B4FA" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#94E2D5" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="28" y1="24" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBA6F7"/>
      <stop offset="55%" stop-color="#89B4FA"/>
      <stop offset="100%" stop-color="#94E2D5"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="120" y1="78" x2="360" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A6E3A1"/>
      <stop offset="55%" stop-color="#F9E2AF"/>
      <stop offset="100%" stop-color="#FAB387"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer capsule card -->
  <rect x="2" y="2" width="416" height="112" rx="22" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Floating orbit ring -->
  <ellipse cx="62" cy="58" rx="34" ry="13" transform="rotate(-24 62 58)" stroke="#89B4FA" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="91" cy="45" r="3" fill="#94E2D5" filter="url(#glow)"/>

  <!-- Antigravity 4-point star emblem -->
  <path d="M62 28 C64 46, 74 56, 92 58 C74 60, 64 70, 62 88 C60 70, 50 60, 32 58 C50 56, 60 46, 62 28 Z" fill="url(#starGrad)" filter="url(#glow)"/>

  <!-- Wordmark -->
  <text x="118" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="38" font-weight="700" letter-spacing="1.5" fill="#CDD6F4">agy<tspan fill="#CBA6F7">bar</tspan></text>

  <!-- Stylized gradient status bar beneath wordmark -->
  <rect x="120" y="78" width="168" height="7" rx="3.5" fill="url(#barGrad)"/>
  <rect x="294" y="78" width="42" height="7" rx="3.5" fill="#45475A"/>
  <rect x="342" y="78" width="22" height="7" rx="3.5" fill="#313244"/>
  <circle cx="380" cy="81.5" r="4" fill="#A6E3A1"/>
</svg>
